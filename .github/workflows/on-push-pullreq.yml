on:
  push:
    paths: ['Frends.HIT.RemoteFS/**', '.github/workflows/on-push-pullreq.yml']
    branches: ['main']
  pull_request:
    paths: ['Frends.HIT.RemoteFS/**', '.github/workflows/on-push-pullreq.yml']
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 8.x

    - name: Restore
      run: |
        dotnet restore ${{ github.event.repository.name }}/${{ github.event.repository.name }}.csproj
        dotnet restore ${{ github.event.repository.name }}.Tests/${{ github.event.repository.name }}.Tests.csproj
    
    - name: Test
      run: |
        dotnet test ${{ github.event.repository.name }}.Tests/${{ github.event.repository.name }}.Tests.csproj
    
    - name: Test Build and Pack
      run: |
        dotnet build --configuration Release ${{ github.event.repository.name }}/${{ github.event.repository.name }}.csproj /p:Version=$GITHUB_REF_NAME
        dotnet pack --configuration Release ${{ github.event.repository.name }}/${{ github.event.repository.name }}.csproj --include-source /p:Version=$GITHUB_REF_NAME